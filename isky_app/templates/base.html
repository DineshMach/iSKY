{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ISKY ERP{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Shared colors / layout classes -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<!-- Page-specific styles only -->
{% block extra_css %}{% endblock %}
</head>
<body>

<!-- Global API/Nav loader -->
<div id="globalLoader" class="global-loader">
  <div class="global-loader-bar"></div>
</div>

{% block content %}
{% endblock %}

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'js/global-loader.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
